<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="stylesheet" href="leaflet/leaflet.css" />
  <script src="leaflet/leaflet.js"></script>
  <style>
    html, body, #map { height: 100%; margin: 0; padding: 0; background: #eef4fc; }
    .leaflet-popup-content { font: 13px system-ui, sans-serif; color: #10233F; }
    .leaflet-container { font: 13px system-ui, sans-serif; }
    .leaflet-control-mylocation a {
      font-size: 18px; line-height: 30px; text-align: center;
      width: 30px; height: 30px; display: block; text-decoration: none; color: #10233F;
    }
  </style>
</head>
<body>
<div id="map"></div>
<script>
  // Leaflet + OpenStreetMap: library bundled offline, no Google, no Mapbox.
  // Tiles still load from OpenStreetMap (network required for map imagery).
  var map = L.map('map', { zoomControl: true }).setView([9.1732, 124.7290], 11);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  // "My location" control: asks Android to fetch the device GPS fix.
  var MyLocationControl = L.Control.extend({
    onAdd: function (m) {
      var container = L.DomUtil.create('div', 'leaflet-bar leaflet-control');
      var btn = L.DomUtil.create('a', '', container);
      btn.href = '#';
      btn.title = 'My location';
      btn.innerHTML = '&#128205;';
      L.DomEvent.on(btn, 'click', function (e) {
        L.DomEvent.stopPropagation(e);
        L.DomEvent.preventDefault(e);
        var b = window.AndroidMap;
        if (b && b.onMyLocation) { b.onMyLocation(); }
      });
      return container;
    }
  });
  new MyLocationControl({ position: 'bottomright' }).addTo(map);

  var mainMarker = null;
  var routeLine = null;
  var sellerMarkers = {};
  var pickMode = false;

  function bridge() {
    return (window.AndroidMap && window.AndroidMap.onPick) ? window.AndroidMap : null;
  }

  function dot(color) {
    return L.divIcon({
      className: '',
      html: '<div style="width:24px;height:24px;border-radius:50%;background:' + color +
            ';border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)"></div>',
      iconSize: [24, 24],
      iconAnchor: [12, 12]
    });
  }

  function clearPins() {
    if (mainMarker) { map.removeLayer(mainMarker); mainMarker = null; }
    Object.keys(sellerMarkers).forEach(function (k) { map.removeLayer(sellerMarkers[k]); });
    sellerMarkers = {};
  }

  function placeMain(lat, lng, label) {
    mainMarker = L.marker([lat, lng], { draggable: pickMode, icon: dot('#1565C0') }).addTo(map);
    if (label) { mainMarker.bindPopup(label); }
    mainMarker.on('dragend', function () {
      var p = mainMarker.getLatLng();
      var b = bridge();
      if (b) { b.onPick(p.lat, p.lng); }
    });
  }

  window.initMap = function (cfg) {
    cfg = cfg || {};
    clearPins();
    window.clearRoute();

    var lat = (cfg.lat === undefined) ? 9.1732 : cfg.lat;
    var lng = (cfg.lng === undefined) ? 124.7290 : cfg.lng;
    pickMode = !!cfg.pickMode;

    map.setView([lat, lng], cfg.zoom || 13);
    if (cfg.showPickup !== false) { placeMain(lat, lng, cfg.label); }

    (cfg.sellers || []).forEach(function (s) {
      if (s.lat === null || s.lng === null) { return; }
      var m = L.marker([s.lat, s.lng], { icon: dot('#0B3F91') }).addTo(map);
      var html = '<b>' + (s.title || 'Seller') + '</b>';
      if (s.town) { html += '<br/>' + s.town; }
      m.bindPopup(html);
      m.on('click', function () {
        var b = window.AndroidMap;
        if (b && b.onMarker) { b.onMarker(String(s.id || '')); }
      });
      sellerMarkers[String(s.id || s.title)] = m;
    });

    if (cfg.route && cfg.route.length) { window.setRoute(cfg.route); }
  };

  window.setRoute = function (points) {
    window.clearRoute();
    if (!points || !points.length) { return; }
    var latlngs = points.map(function (p) { return [p[0], p[1]]; });
    routeLine = L.polyline(latlngs, { color: '#1565C0', weight: 5, opacity: 0.9 }).addTo(map);
    map.fitBounds(routeLine.getBounds(), { padding: [30, 30] });
  };

  window.clearRoute = function () {
    if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
  };

  window.focusPoint = function (lat, lng, zoom) {
    map.setView([lat, lng], zoom || 15);
    if (mainMarker) { mainMarker.setLatLng([lat, lng]); }
  };

  window.setPickMode = function (on) {
    pickMode = !!on;
    if (mainMarker) { mainMarker.options.draggable = pickMode; }
  };

  map.on('click', function (e) {
    if (!pickMode) { return; }
    if (mainMarker) {
      mainMarker.setLatLng(e.latlng);
    } else {
      placeMain(e.latlng.lat, e.latlng.lng, '');
    }
    var b = bridge();
    if (b) { b.onPick(e.latlng.lat, e.latlng.lng); }
  });

  if (window.AndroidMap && window.AndroidMap.onReady) { window.AndroidMap.onReady(); }
</script>
</body>
</html>
