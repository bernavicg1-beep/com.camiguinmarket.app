name: Apply MainActivity changes
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply changes
        env:
          SCRIPT: 
        run: |
          echo "$SCRIPT" | base64 -d > /tmp/apply_ma.py
          python3 /tmp/apply_ma.py
      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add app/src/main/java/com/camiguinmarket/app/MainActivity.kt
          git commit -m "Apply MainActivity app-link changes" || echo "No changes"
          git push