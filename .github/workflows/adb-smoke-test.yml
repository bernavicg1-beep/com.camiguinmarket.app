name: Adb smoke test

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint workflows and shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Install ShellCheck (pinned)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/shellcheck.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xf /tmp/shellcheck.tar.xz -C /tmp
          install /tmp/shellcheck-v0.11.0/shellcheck "$HOME/.local/bin/shellcheck"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          shellcheck --version

      - name: ShellCheck scripts
        run: shellcheck scripts/*.sh

      - uses: raven-actions/actionlint@v2.2.0
        with:
          actionlint_version: 1.7.12

  fake-adb:
    name: Fake-adb smoke test (no device)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Run the fake-adb self-test
        run: bash scripts/test-adb-smoke-test.sh

  emulator-smoke:
    name: Emulator smoke tests
    needs: [lint, fake-adb]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.9.1

      - name: Check smoke-test credentials
        env:
          SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |-
          test -n "$SMOKE_TEST_EMAIL" || { echo "::error::SMOKE_TEST_EMAIL secret is not set"; exit 1; }
          test -n "$SMOKE_TEST_PASSWORD" || { echo "::error::SMOKE_TEST_PASSWORD secret is not set"; exit 1; }
          test -n "$FIREBASE_SERVICE_ACCOUNT" || { echo "::error::FIREBASE_SERVICE_ACCOUNT secret is not set (needed to seed smoke listings)"; exit 1; }

      # The runner user cannot read /dev/kvm by default, and the emulator action
      # silently falls back to -accel off, which emulator 37 refuses to start
      # with ("Software CPU emulation (-accel off) is not supported").
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The listings belong to a synthetic seller (scripts/seed-smoke-listings.sh)
      # so the test account gets a real "Add to cart" action. The suffix (job +
      # run) keeps this run's documents private: parallel jobs and overlapping
      # runs would otherwise overwrite each other and delete each other's seeds.
      - name: Seed smoke listings
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SMOKE_SEED_SUFFIX: ${{ github.job }}-${{ github.run_number }}
          SMOKE_SEED_REQUIRED: "1"
        run: bash scripts/seed-smoke-listings.sh seed

      # The action runs each script line in its own shell, so the credentials are
      # passed as step env instead of being exported inside the script.
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
        with:
          api-level: 34
          arch: x86_64
          script: bash scripts/run-smoke-tests.sh

      # Read-only: shows whether the seeded documents survived the run, so a
      # "seeded but not on screen" failure is diagnosable from the logs alone.
      - name: Verify seeded listings
        if: always()
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SMOKE_SEED_SUFFIX: ${{ github.job }}-${{ github.run_number }}
        run: bash scripts/seed-smoke-listings.sh verify

      - name: Remove seeded listings
        if: always()
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SMOKE_SEED_SUFFIX: ${{ github.job }}-${{ github.run_number }}
        run: bash scripts/seed-smoke-listings.sh cleanup

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: smoke-failure-diagnostics
          path: smoke-failure-artifacts
          if-no-files-found: warn

  emulator-smoke-quick:
    name: Emulator smoke tests (quick)
    needs: [lint, fake-adb]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.9.1

      - name: Check smoke-test credentials
        env:
          SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
        run: |-
          test -n "$SMOKE_TEST_EMAIL" || { echo "::error::SMOKE_TEST_EMAIL secret is not set"; exit 1; }
          test -n "$SMOKE_TEST_PASSWORD" || { echo "::error::SMOKE_TEST_PASSWORD secret is not set"; exit 1; }

      # The runner user cannot read /dev/kvm by default, and the emulator action
      # silently falls back to -accel off, which emulator 37 refuses to start
      # with ("Software CPU emulation (-accel off) is not supported").
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The action runs each script line in its own shell, so the credentials are
      # passed as step env instead of being exported inside the script.
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
        with:
          api-level: 34
          arch: x86_64
          script: SMOKE_TEST_CLASSES='com.camiguinmarket.app.SmokeTest#bisayaToggleUpdatesLabelsAndPersists' bash scripts/run-smoke-tests.sh

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: smoke-quick-failure-diagnostics
          path: smoke-failure-artifacts
          if-no-files-found: warn

  emulator-smoke-subset:
    name: Emulator smoke tests (subset)
    needs: [lint, fake-adb]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.9.1

      - name: Check smoke-test credentials
        env:
          SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |-
          test -n "$SMOKE_TEST_EMAIL" || { echo "::error::SMOKE_TEST_EMAIL secret is not set"; exit 1; }
          test -n "$SMOKE_TEST_PASSWORD" || { echo "::error::SMOKE_TEST_PASSWORD secret is not set"; exit 1; }
          test -n "$FIREBASE_SERVICE_ACCOUNT" || { echo "::error::FIREBASE_SERVICE_ACCOUNT secret is not set (needed to seed smoke listings)"; exit 1; }

      # The runner user cannot read /dev/kvm by default, and the emulator action
      # silently falls back to -accel off, which emulator 37 refuses to start
      # with ("Software CPU emulation (-accel off) is not supported").
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The listings belong to a synthetic seller (scripts/seed-smoke-listings.sh)
      # so the test account gets a real "Add to cart" action. The suffix (job +
      # run) keeps this run's documents private: parallel jobs and overlapping
      # runs would otherwise overwrite each other and delete each other's seeds.
      - name: Seed smoke listings
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SMOKE_SEED_SUFFIX: ${{ github.job }}-${{ github.run_number }}
          SMOKE_SEED_REQUIRED: "1"
        run: bash scripts/seed-smoke-listings.sh seed

      # The action runs each script line in its own shell, so the credentials are
      # passed as step env instead of being exported inside the script.
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
        with:
          api-level: 34
          arch: x86_64
          script: SMOKE_TEST_CLASSES='com.camiguinmarket.app.SmokeTest#bisayaToggleUpdatesLabelsAndPersists,com.camiguinmarket.app.SmokeTest#postListingCreatesDocument,com.camiguinmarket.app.SmokeTest#cartCheckoutPlacesOrder,com.camiguinmarket.app.SmokeTest#ordersScreenRenders' bash scripts/run-smoke-tests.sh

      # Read-only: shows whether the seeded documents survived the run, so a
      # "seeded but not on screen" failure is diagnosable from the logs alone.
      - name: Verify seeded listings
        if: always()
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SMOKE_SEED_SUFFIX: ${{ github.job }}-${{ github.run_number }}
        run: bash scripts/seed-smoke-listings.sh verify

      - name: Remove seeded listings
        if: always()
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SMOKE_SEED_SUFFIX: ${{ github.job }}-${{ github.run_number }}
        run: bash scripts/seed-smoke-listings.sh cleanup

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: smoke-subset-failure-diagnostics
          path: smoke-failure-artifacts
          if-no-files-found: warn

  # Optional run of the full suite: a test account is a nice-to-have here, so
  # missing secrets skip the emulator work instead of failing the pull request.
  emulator-smoke-optional:
    name: Emulator smoke tests (optional account)
    needs: [lint, fake-adb]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.9.1

      - name: Check smoke-test credentials
        id: creds
        env:
          SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$SMOKE_TEST_EMAIL" ] && [ -n "$SMOKE_TEST_PASSWORD" ] && [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Test account present - the smoke suite will run."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Smoke-test secrets are not set - skipping the smoke suite."
          fi

      # The listings belong to a synthetic seller (scripts/seed-smoke-listings.sh)
      # so the test account gets a real "Add to cart" action. The suffix (job +
      # run) keeps this run's documents private: parallel jobs and overlapping
      # runs would otherwise overwrite each other and delete each other's seeds.
      - name: Seed smoke listings
        if: steps.creds.outputs.available == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SMOKE_SEED_SUFFIX: ${{ github.job }}-${{ github.run_number }}
          SMOKE_SEED_REQUIRED: "1"
        run: bash scripts/seed-smoke-listings.sh seed

      # The runner user cannot read /dev/kvm by default, and the emulator action
      # silently falls back to -accel off, which emulator 37 refuses to start
      # with ("Software CPU emulation (-accel off) is not supported").
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The action runs each script line in its own shell, so the credentials are
      # passed as step env instead of being exported inside the script.
      - uses: reactivecircus/android-emulator-runner@v2
        if: steps.creds.outputs.available == 'true'
        env:
          SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
        with:
          api-level: 34
          arch: x86_64
          script: bash scripts/run-smoke-tests.sh

      - name: Verify seeded listings
        if: always() && steps.creds.outputs.available == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SMOKE_SEED_SUFFIX: ${{ github.job }}-${{ github.run_number }}
        run: bash scripts/seed-smoke-listings.sh verify

      - name: Remove seeded listings
        if: always() && steps.creds.outputs.available == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SMOKE_SEED_SUFFIX: ${{ github.job }}-${{ github.run_number }}
        run: bash scripts/seed-smoke-listings.sh cleanup

      - uses: actions/upload-artifact@v7
        if: failure() && steps.creds.outputs.available == 'true'
        with:
          name: optional-smoke-failure-diagnostics
          path: optional-smoke-artifacts
          if-no-files-found: warn
