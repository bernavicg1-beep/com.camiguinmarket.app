name: Adb smoke test

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint workflows and shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: ludeeus/action-shellcheck@v2.0.0
        with:
          version: v0.11.0

      - uses: raven-actions/actionlint@v2.2.0
        with:
          actionlint_version: 1.7.12
          shellcheck: false

  fake-adb:
    name: Fake-adb smoke test (no device)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Run the fake-adb self-test
        run: bash scripts/test-adb-smoke-test.sh

  emulator-smoke:
    name: Emulator smoke tests
    needs: [lint, fake-adb]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-34.0 build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.9.1

      - name: Check smoke-test credentials
        env:
          SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
        run: |
          test -n "$SMOKE_TEST_EMAIL" || { echo "::error::SMOKE_TEST_EMAIL secret is not set"; exit 1; }
          test -n "$SMOKE_TEST_PASSWORD" || { echo "::error::SMOKE_TEST_PASSWORD secret is not set"; exit 1; }

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          script: |
            set +e
            export SMOKE_TEST_EMAIL="${{ secrets.SMOKE_TEST_EMAIL }}"
            export SMOKE_TEST_PASSWORD="${{ secrets.SMOKE_TEST_PASSWORD }}"
            bash scripts/run-smoke-tests.sh
            status=$?
            if [ "$status" -ne 0 ]; then
              bash scripts/collect-smoke-artifacts.sh smoke-failure-artifacts
            fi
            exit "$status"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: smoke-failure-diagnostics
          path: smoke-failure-artifacts
          if-no-files-found: warn

  emulator-smoke-subset:
    name: Emulator smoke tests (subset)
    needs: [lint, fake-adb]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-34.0 build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.9.1

      - name: Check smoke-test credentials
        env:
          SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
        run: |
          test -n "$SMOKE_TEST_EMAIL" || { echo "::error::SMOKE_TEST_EMAIL secret is not set"; exit 1; }
          test -n "$SMOKE_TEST_PASSWORD" || { echo "::error::SMOKE_TEST_PASSWORD secret is not set"; exit 1; }

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          script: |
            set +e
            export SMOKE_TEST_EMAIL="${{ secrets.SMOKE_TEST_EMAIL }}"
            export SMOKE_TEST_PASSWORD="${{ secrets.SMOKE_TEST_PASSWORD }}"
            gradle :app:connectedDebugAndroidTest --no-daemon \
              -Pandroid.testInstrumentationRunnerArguments.smokeEmail="$SMOKE_TEST_EMAIL" \
              -Pandroid.testInstrumentationRunnerArguments.smokePassword="$SMOKE_TEST_PASSWORD" \
              -Pandroid.testInstrumentationRunnerArguments.class=com.camiguinmarket.app.SmokeTest#bisayaToggleUpdatesLabelsAndPersists
            status=$?
            if [ "$status" -ne 0 ]; then
              bash scripts/collect-smoke-artifacts.sh smoke-subset-failure-artifacts
            fi
            exit "$status"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: smoke-subset-failure-diagnostics
          path: smoke-subset-failure-artifacts
          if-no-files-found: warn

  # Optional run of the full suite: a test account is a nice-to-have here, so
  # missing secrets skip the emulator work instead of failing the pull request.
  emulator-smoke-optional:
    name: Emulator smoke tests (optional account)
    needs: [lint, fake-adb]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-34.0 build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.9.1

      - name: Check smoke-test credentials
        id: creds
        env:
          SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
        run: |
          if [ -n "$SMOKE_TEST_EMAIL" ] && [ -n "$SMOKE_TEST_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Test account present - the smoke suite will run."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SMOKE_TEST_EMAIL/SMOKE_TEST_PASSWORD are not set - skipping the smoke suite."
          fi

      - uses: reactivecircus/android-emulator-runner@v2
        if: steps.creds.outputs.available == 'true'
        with:
          api-level: 34
          script: |
            set +e
            export SMOKE_TEST_EMAIL="${{ secrets.SMOKE_TEST_EMAIL }}"
            export SMOKE_TEST_PASSWORD="${{ secrets.SMOKE_TEST_PASSWORD }}"
            bash scripts/run-smoke-tests.sh
            status=$?
            if [ "$status" -ne 0 ]; then
              bash scripts/collect-smoke-artifacts.sh optional-smoke-artifacts
            fi
            exit "$status"

      - uses: actions/upload-artifact@v7
        if: failure() && steps.creds.outputs.available == 'true'
        with:
          name: optional-smoke-failure-diagnostics
          path: optional-smoke-artifacts
          if-no-files-found: warn
