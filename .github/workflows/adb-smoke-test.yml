name: Adb smoke test

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint workflows and shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Install ShellCheck (pinned)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/shellcheck.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xf /tmp/shellcheck.tar.xz -C /tmp
          install /tmp/shellcheck-v0.11.0/shellcheck "$HOME/.local/bin/shellcheck"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          shellcheck --version

      - name: ShellCheck scripts
        run: shellcheck scripts/*.sh

      - uses: raven-actions/actionlint@v2.2.0
        with:
          actionlint_version: 1.7.12

  fake-adb:
    name: Fake-adb smoke test (no device)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Run the fake-adb self-test
        run: bash scripts/test-adb-smoke-test.sh
