name: Apply smoke chain patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    name: Apply the smoke chain patch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Apply, commit and clean up
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git apply --recount --whitespace=nowarn .github/patches/smoke-chain.patch
          rm -rf .github/patches
          rm -f .github/workflows/apply-smoke-chain.yml
          git add -A
          git commit -m "ci: chain the cart-touching smoke jobs and cover the COM flows in the subset"
          git push origin HEAD:main
