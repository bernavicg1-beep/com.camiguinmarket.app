name: Fix PIN tests

on:
  push:
    paths:
      - .github/patches/fix_pin_tests.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Apply
        run: python3 .github/patches/fix_pin_tests.py

      - name: Commit and push
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/patches/fix_pin_tests.py .github/workflows/fix-pin-tests.yml
          git add scripts/test-firestore-rules.py
          git commit -m "test(rules): repair the admin PIN hash checks"
          git push origin main
