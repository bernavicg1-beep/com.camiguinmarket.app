name: Apply admin dashboard patch

on:
  push:
    paths:
      - '.github/patches/00-trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/com-spec

      - name: Apply the patch
        run: |
          set -euo pipefail
          git apply --verbose .github/patches/admin.patch

      - name: Commit and clean up
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r -f .github/patches
          git rm -f .github/workflows/apply-admin.yml
          git add -A
          git commit -m "Wire the admin dashboard and announcements into Profile and Home"
          git push origin HEAD:feature/com-spec
