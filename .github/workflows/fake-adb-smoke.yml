name: Fake-adb smoke test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fake-adb-smoke:
    name: Fake-adb smoke test (no device)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Run the fake-adb self-test
        run: |
          set -e
          bash scripts/test-adb-smoke-test.sh
