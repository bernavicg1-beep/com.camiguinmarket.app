name: Grant admin (one-shot)

# One-shot variant of grant-admin.yml, triggered by a push so it works on a
# feature branch (workflow_dispatch only sees workflows on the default branch).
# Reads the sign-in email from .github/patches/00-grant.txt, writes
# admins/{uid}, then removes itself.
on:
  push:
    paths:
      - '.github/patches/00-grant.txt'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/com-spec

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install the Admin SDK
        run: |
          npm init -y > /dev/null
          npm install --no-audit --no-fund firebase-admin@12

      - name: Grant the marker
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          MODE: grant
        run: |
          set -euo pipefail
          EMAIL="$(tr -d '[:space:]' < .github/patches/00-grant.txt)"
          EMAIL="$EMAIL" node .github/scripts/grant-admin.mjs

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: admin-result
          path: admin-result.json

      - name: Remove the one-shot files
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/grant-admin-once.yml
          git rm -r -f .github/patches
          git add -A
          git commit -m "Remove the one-shot admin grant workflow"
          git push origin HEAD:feature/com-spec
