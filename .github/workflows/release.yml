name: Release APK

# Builds a signed release APK + AAB and publishes them as a GitHub Release, so
# the APK has a permanent download link (Actions artifacts expire).
# Run it by pushing a tag (v0.8, v1.0, …) or manually from the Actions tab.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.9.1

      # A release signed with anything but the project key cannot be installed
      # as an update, so refuse to publish one.
      - name: Check the signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          for v in "$KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            [ -z "$v" ] && missing=$((missing + 1))
          done
          if [ "$missing" -gt 0 ]; then
            echo "::error::$missing of the 4 signing secrets are not set (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD). See the README section 'Signing the release build'."
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"

      - name: Build release APK + AAB
        env:
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >-
          gradle assembleRelease bundleRelease --no-daemon
          -PR2_UPLOAD_URL="${{ secrets.R2_UPLOAD_URL }}"

      - name: Verify the release signature
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          signer=$(find "$ANDROID_SDK_ROOT"/build-tools -name apksigner -type f | sort -V | tail -n 1)
          "$signer" verify --print-certs "$apk"

      - name: Read the version from the APK
        id: version
        run: |
          aapt2=$(find "$ANDROID_SDK_ROOT"/build-tools -name aapt2 -type f | sort -V | tail -n 1)
          line=$("$aapt2" dump badging app/build/outputs/apk/release/app-release.apk | head -n 1)
          name=$(echo "$line" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          code=$(echo "$line" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
          {
            echo "name=$name"
            echo "code=$code"
            echo "tag=v$name"
          } >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PUSHED_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          BUILT_TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          tag="${PUSHED_TAG:-$BUILT_TAG}"
          cp app/build/outputs/apk/release/app-release.apk "CamiguinMarket-${VERSION_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "CamiguinMarket-${VERSION_NAME}.aab"

          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "CamiguinMarket-${VERSION_NAME}.apk" "CamiguinMarket-${VERSION_NAME}.aab" --clobber
          else
            notes=$(printf 'Signed Camiguin Market release.\n\n- versionName: %s\n- versionCode: %s\n- APK for sideloading, AAB for the Play Console.\n- Signature verified with apksigner before publishing.\n\nUninstall any build signed with a different key before installing.\n' "$VERSION_NAME" "$VERSION_CODE")
            if [ -n "$PUSHED_TAG" ]; then
              gh release create "$tag" "CamiguinMarket-${VERSION_NAME}.apk" "CamiguinMarket-${VERSION_NAME}.aab" \
                --title "Camiguin Market $VERSION_NAME" --notes "$notes"
            else
              gh release create "$tag" "CamiguinMarket-${VERSION_NAME}.apk" "CamiguinMarket-${VERSION_NAME}.aab" \
                --title "Camiguin Market $VERSION_NAME" --notes "$notes" --target "$GITHUB_SHA"
            fi
          fi
          echo "Released $tag" >> "$GITHUB_STEP_SUMMARY"
