name: Apply trust layer files

# One-shot helper: the contents API truncated the large trust-layer sources,
# so this job rebuilds them from origin/main plus the checked-in patches, then
# removes itself and the patches in the same commit.
on:
  push:
    branches: [feature/trust-layer]
    paths:
      - '.github/patches/**'
      - '.github/workflows/apply-trust-layer.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/trust-layer
          fetch-depth: 0

      - name: Rebuild sources from main + patches
        run: |
          set -euo pipefail
          if [ ! -d .github/patches ]; then
            echo "patches already applied; nothing to do"
            exit 0
          fi
          git fetch origin main
          git checkout origin/main -- \
            worker/index.js \
            firestore.rules \
            app/src/main/java/com/camiguinmarket/app/Extras.kt \
            app/src/main/java/com/camiguinmarket/app/MainActivity.kt \
            app/src/main/java/com/camiguinmarket/app/Ratings.kt \
            app/src/main/java/com/camiguinmarket/app/Trust.kt \
            app/src/main/java/com/camiguinmarket/app/Moderation.kt
          for p in .github/patches/*.patch; do
            echo "applying $p"
            git apply -p1 --verbose "$p"
          done

      - name: Verify byte sizes
        run: |
          set -euo pipefail
          wc -c worker/index.js firestore.rules \
            app/src/main/java/com/camiguinmarket/app/Extras.kt \
            app/src/main/java/com/camiguinmarket/app/MainActivity.kt \
            app/src/main/java/com/camiguinmarket/app/Ratings.kt \
            app/src/main/java/com/camiguinmarket/app/Trust.kt \
            app/src/main/java/com/camiguinmarket/app/Moderation.kt

      - name: Commit, push and clean up
        run: |
          set -euo pipefail
          git config user.name "bernavicg1-beep"
          git config user.email "bernavicg1-beep@users.noreply.github.com"
          git rm -r --quiet .github/patches
          git rm --quiet .github/workflows/apply-trust-layer.yml
          git add -A
          git diff --cached --stat
          git commit -m "Restore trust-layer sources truncated by the contents API"
          git push origin HEAD:refs/heads/feature/trust-layer
