name: Apply println quote fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Apply the patch and commit
        run: |
          set -euo pipefail
          git apply --recount --whitespace=nowarn .github/patches/println-quote-fix.patch
          rm -rf .github/patches .github/workflows/apply-println-quote-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: unescape quotes inside the println string template in tapLanguageToggle"
          git push origin HEAD:main
