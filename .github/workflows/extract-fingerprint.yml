name: Extract fingerprint

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Decode keystore and extract SHA-256 fingerprint
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"
          fp=$(keytool -list -v -keystore "$RUNNER_TEMP/release.keystore" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | grep -i 'SHA256:' | head -n1 | sed 's/.*SHA256:[[:space:]]*//I' | tr -d ' ')
          echo "Fingerprint: $fp"
          if [ -z "$fp" ]; then echo "::error::Could not extract SHA256 fingerprint"; exit 1; fi
          echo "$fp" > worker/.fingerprint
          cat worker/.fingerprint

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add worker/.fingerprint
          git commit -m "Add release keystore SHA-256 fingerprint"
          git push origin HEAD:main