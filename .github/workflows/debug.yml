name: Debug workflow
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check file exists
        run: |
          ls -la app/src/main/java/com/camiguinmarket/app/MainActivity.kt
          head -5 app/src/main/java/com/camiguinmarket/app/MainActivity.kt
          python3 --version
          python3 scratchpad/apply_ma.py
