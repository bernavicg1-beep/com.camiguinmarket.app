name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.9.1

      - name: Check google-services.json
        run: test -f app/google-services.json || (echo "Missing app/google-services.json" && exit 1)

      - name: Build debug APK
        run: >-
          gradle assembleDebug --no-daemon
          -PMAPS_API_KEY="${{ secrets.MAPS_API_KEY }}"
          -PMAPBOX_ACCESS_TOKEN="${{ secrets.MAPBOX_ACCESS_TOKEN }}"

      - uses: actions/upload-artifact@v7
        with:
          name: CamiguinMarket-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Kon naa ang duha ka secret, i-build usab ang release variant.
      - name: Check secrets
        id: secrets
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Ang mga value mismo dili gayud i-print, status ra (na-set o kulang).
          if [ -n "$MAPS_API_KEY" ] && [ -n "$MAPBOX_ACCESS_TOKEN" ]; then
            available=true
          else
            available=false
          fi
          if [ -n "$KEYSTORE_BASE64" ]; then signing=true; else signing=false; fi

          echo "available=$available" >> "$GITHUB_OUTPUT"
          echo "signing=$signing" >> "$GITHUB_OUTPUT"

          mark() { if [ -n "$1" ]; then echo "✅ na-set"; else echo "❌ kulang"; fi; }

          {
            echo "## Status sa build secrets"
            echo ""
            echo "| Secret | Status | Alang sa unsa |"
            echo "|---|---|---|"
            echo "| \`MAPS_API_KEY\` | $(mark "$MAPS_API_KEY") | Google map, ruta A→B, place search |"
            echo "| \`MAPBOX_ACCESS_TOKEN\` | $(mark "$MAPBOX_ACCESS_TOKEN") | Mapbox map sa WebView |"
            echo "| \`KEYSTORE_BASE64\` | $(mark "$KEYSTORE_BASE64") | signed release APK |"
            echo "| \`KEYSTORE_PASSWORD\` | $(mark "$KEYSTORE_PASSWORD") | signing |"
            echo "| \`KEY_ALIAS\` | $(mark "$KEY_ALIAS") | signing |"
            echo "| \`KEY_PASSWORD\` | $(mark "$KEY_PASSWORD") | signing |"
            echo ""
            if [ "$available" = "true" ]; then
              if [ "$signing" = "true" ]; then
                echo "Ang release build modagan niini nga run (signed)."
              else
                echo "Ang release build modagan niini nga run (unsigned)."
              fi
              echo ""
              echo "I-upload usab ang **AAB** (\`CamiguinMarket-release-aab\`) alang sa Google Play Console."
            else
              echo "⚠️ **Gilaktawan ang release build** kay kulang ang \`MAPS_API_KEY\` o \`MAPBOX_ACCESS_TOKEN\`. Idugang kini sa Settings → Secrets and variables → Actions, dayon i-run pag-usab ang workflow."
              echo ""
              echo "Ang debug APK niini nga run **walay Maps API key**, busa dili mo-render ang sulod-app nga Google map niini."
            fi
            if [ "$signing" != "true" ]; then
              echo ""
              echo "Wala \`KEYSTORE_BASE64\`: kon modagan ang release build, **unsigned** ang APK ug dili kini ma-install."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # I-decode ang keystore gikan sa secret (base64) ngadto sa runner temp.
      - name: Decode keystore
        if: steps.secrets.outputs.available == 'true' && steps.secrets.outputs.signing == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"

      # Kon naa ang KEYSTORE_BASE64, signed ang APK; kon wala, unsigned.
      # Apil usab ang AAB (App Bundle) alang sa Play Store.
      - name: Build release APK + AAB
        if: steps.secrets.outputs.available == 'true'
        env:
          RELEASE_KEYSTORE_FILE: ${{ steps.secrets.outputs.signing == 'true' && format('{0}/release.keystore', runner.temp) || '' }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >-
          gradle assembleRelease bundleRelease --no-daemon
          -PMAPS_API_KEY="${{ secrets.MAPS_API_KEY }}"
          -PMAPBOX_ACCESS_TOKEN="${{ secrets.MAPBOX_ACCESS_TOKEN }}"

      - name: Upload release APK
        if: steps.secrets.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: CamiguinMarket-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      # Ang .aab mao ang format nga gidawat sa Google Play Console.
      - name: Upload release AAB
        if: steps.secrets.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: CamiguinMarket-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
