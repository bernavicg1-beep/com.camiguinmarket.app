name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Check google-services.json
        run: test -f app/google-services.json || (echo "Missing app/google-services.json" && exit 1)

      - name: Build debug APK
        run: >-
          gradle assembleDebug --no-daemon
          -PMAPS_API_KEY="${{ secrets.MAPS_API_KEY }}"
          -PMAPBOX_ACCESS_TOKEN="${{ secrets.MAPBOX_ACCESS_TOKEN }}"

      - uses: actions/upload-artifact@v4
        with:
          name: CamiguinMarket-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
