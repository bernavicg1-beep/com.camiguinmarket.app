name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.9.1

      - name: Check google-services.json
        run: test -f app/google-services.json || (echo "Missing app/google-services.json" && exit 1)

      - name: Build debug APK
        run: >-
          gradle assembleDebug --no-daemon
          -PMAPS_API_KEY="${{ secrets.MAPS_API_KEY }}"
          -PMAPBOX_ACCESS_TOKEN="${{ secrets.MAPBOX_ACCESS_TOKEN }}"
          -PR2_UPLOAD_URL="${{ secrets.R2_UPLOAD_URL }}"

      - uses: actions/upload-artifact@v7
        with:
          name: CamiguinMarket-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Check secrets
        id: secrets
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          R2_UPLOAD_URL: ${{ secrets.R2_UPLOAD_URL }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Values are never printed — only whether each secret is set.
          if [ -n "$MAPS_API_KEY" ] && [ -n "$MAPBOX_ACCESS_TOKEN" ]; then
            available=true
          else
            available=false
          fi
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] \
             && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            signing=true
          else
            signing=false
          fi

          echo "available=$available" >> "$GITHUB_OUTPUT"
          echo "signing=$signing" >> "$GITHUB_OUTPUT"

          mark() { if [ -n "$1" ]; then echo "✅ set"; else echo "⬜ not set"; fi; }

          missing=0
          total=8
          for v in "$MAPS_API_KEY" "$MAPBOX_ACCESS_TOKEN" "$R2_UPLOAD_URL" \
                   "$FIREBASE_SERVICE_ACCOUNT" "$KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" \
                   "$KEY_ALIAS" "$KEY_PASSWORD"; do
            [ -z "$v" ] && missing=$((missing + 1))
          done

          {
            echo "## Build secrets status"
            echo ""
            echo "| Secret | Status | Used for | Required |"
            echo "|---|---|---|---|"
            echo "| \`MAPS_API_KEY\` | $(mark "$MAPS_API_KEY") | Google Maps, A→B route, place search | for release build |"
            echo "| \`MAPBOX_ACCESS_TOKEN\` | $(mark "$MAPBOX_ACCESS_TOKEN") | Mapbox map in the WebView | for release build |"
            echo "| \`R2_UPLOAD_URL\` | $(mark "$R2_UPLOAD_URL") | Listing photo upload + push (Cloudflare Worker) | recommended |"
            echo "| \`FIREBASE_SERVICE_ACCOUNT\` | $(mark "$FIREBASE_SERVICE_ACCOUNT") | Firestore rules deploy (GitHub Actions) | recommended |"
            echo "| \`KEYSTORE_BASE64\` | $(mark "$KEYSTORE_BASE64") | Signed release APK/AAB | optional |"
            echo "| \`KEYSTORE_PASSWORD\` | $(mark "$KEYSTORE_PASSWORD") | Signing | optional |"
            echo "| \`KEY_ALIAS\` | $(mark "$KEY_ALIAS") | Signing | optional |"
            echo "| \`KEY_PASSWORD\` | $(mark "$KEY_PASSWORD") | Signing | optional |"
            echo ""
            echo "**Debug APK:** always built and installable — no secret required."
            echo ""
            if [ "$available" = "true" ]; then
              if [ "$signing" = "true" ]; then
                echo "**Release build:** running (signed)."
              else
                echo "**Release build:** running (unsigned — add the keystore secrets to sign it)."
              fi
              echo ""
              echo "The **AAB** (\`CamiguinMarket-release-aab\`) is uploaded too, for Google Play Console."
            else
              echo "**Release build:** skipped because \`MAPS_API_KEY\` or \`MAPBOX_ACCESS_TOKEN\` is missing."
              echo "Add them in Settings → Secrets and variables → Actions, then run this workflow again."
              echo ""
              echo "The debug APK from this run has **no Maps API key**, so the in-app Google map will not render."
            fi
            if [ "$missing" -gt 0 ]; then
              echo ""
              echo "$missing of $total secrets are not set. Optional ones stay ⬜ until you add them; nothing else breaks."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Decode keystore
        if: steps.secrets.outputs.available == 'true' && steps.secrets.outputs.signing == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"

      - name: Build release APK + AAB
        if: steps.secrets.outputs.available == 'true'
        env:
          RELEASE_KEYSTORE_FILE: ${{ steps.secrets.outputs.signing == 'true' && format('{0}/release.keystore', runner.temp) || '' }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >-
          gradle assembleRelease bundleRelease --no-daemon
          -PMAPS_API_KEY="${{ secrets.MAPS_API_KEY }}"
          -PMAPBOX_ACCESS_TOKEN="${{ secrets.MAPBOX_ACCESS_TOKEN }}"
          -PR2_UPLOAD_URL="${{ secrets.R2_UPLOAD_URL }}"

      - name: Upload release APK
        if: steps.secrets.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: CamiguinMarket-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload release AAB
        if: steps.secrets.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: CamiguinMarket-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
