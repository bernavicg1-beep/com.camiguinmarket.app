name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Check google-services.json
        run: test -f app/google-services.json || (echo "Missing app/google-services.json" && exit 1)

      - name: Build debug APK
        run: >-
          gradle assembleDebug --no-daemon
          -PMAPS_API_KEY="${{ secrets.MAPS_API_KEY }}"
          -PMAPBOX_ACCESS_TOKEN="${{ secrets.MAPBOX_ACCESS_TOKEN }}"

      - uses: actions/upload-artifact@v4
        with:
          name: CamiguinMarket-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Kon naa ang duha ka secret, i-build usab ang release variant.
      - name: Check secrets
        id: secrets
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
        run: |
          if [ -n "$MAPS_API_KEY" ] && [ -n "$MAPBOX_ACCESS_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Wala ma-set ang MAPS_API_KEY o MAPBOX_ACCESS_TOKEN: gilaktawan ang release build."
          fi

      # Unsigned ang release APK kay walay keystore niini nga repo; i-sign kini
      # sa Play Console o sa imong kaugalingon nga keystore kon i-release na.
      - name: Build release APK
        if: steps.secrets.outputs.available == 'true'
        run: >-
          gradle assembleRelease --no-daemon
          -PMAPS_API_KEY="${{ secrets.MAPS_API_KEY }}"
          -PMAPBOX_ACCESS_TOKEN="${{ secrets.MAPBOX_ACCESS_TOKEN }}"

      - name: Upload release APK
        if: steps.secrets.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CamiguinMarket-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
