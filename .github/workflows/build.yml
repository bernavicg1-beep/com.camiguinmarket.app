name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Check google-services.json
        run: test -f app/google-services.json || (echo "Missing app/google-services.json" && exit 1)

      - name: Build debug APK
        run: >-
          gradle assembleDebug --no-daemon
          -PMAPS_API_KEY="${{ secrets.MAPS_API_KEY }}"
          -PMAPBOX_ACCESS_TOKEN="${{ secrets.MAPBOX_ACCESS_TOKEN }}"

      - uses: actions/upload-artifact@v4
        with:
          name: CamiguinMarket-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Kon naa ang duha ka secret, i-build usab ang release variant.
      - name: Check secrets
        id: secrets
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$MAPS_API_KEY" ] && [ -n "$MAPBOX_ACCESS_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Wala ma-set ang MAPS_API_KEY o MAPBOX_ACCESS_TOKEN: gilaktawan ang release build."
          fi
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "signing=false" >> "$GITHUB_OUTPUT"
            echo "Wala ma-set ang KEYSTORE_BASE64: unsigned ang release APK."
          fi

      # I-decode ang keystore gikan sa secret (base64) ngadto sa runner temp.
      - name: Decode keystore
        if: steps.secrets.outputs.available == 'true' && steps.secrets.outputs.signing == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"

      # Kon naa ang KEYSTORE_BASE64, signed ang APK; kon wala, unsigned.
      - name: Build release APK
        if: steps.secrets.outputs.available == 'true'
        env:
          RELEASE_KEYSTORE_FILE: ${{ steps.secrets.outputs.signing == 'true' && format('{0}/release.keystore', runner.temp) || '' }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >-
          gradle assembleRelease --no-daemon
          -PMAPS_API_KEY="${{ secrets.MAPS_API_KEY }}"
          -PMAPBOX_ACCESS_TOKEN="${{ secrets.MAPBOX_ACCESS_TOKEN }}"

      - name: Upload release APK
        if: steps.secrets.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CamiguinMarket-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
