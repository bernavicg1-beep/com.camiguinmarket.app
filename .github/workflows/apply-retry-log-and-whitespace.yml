name: Apply retry log and whitespace fix

# One-shot helper: applies .github/patches/retry-log-and-whitespace.patch, commits
# the result, then removes itself and the patch so main keeps only the change.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Apply the patch and commit
        run: |
          set -euo pipefail
          git apply --recount --whitespace=nowarn .github/patches/retry-log-and-whitespace.patch
          rm -rf .github/patches .github/workflows/apply-retry-log-and-whitespace.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: log when tapLanguageToggle retries and restore SmokeTest.kt whitespace"
          git push origin HEAD:main
