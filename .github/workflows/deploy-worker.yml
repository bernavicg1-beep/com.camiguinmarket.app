name: Deploy Worker

# The app depends on what the deployed Worker does — photo deletion for the
# sellers' photos and the purge of expired perishables — so Worker changes ship
# as soon as they land on main instead of waiting for a manual deploy.
on:
  push:
    branches: [main]
    paths:
      - worker/**
      - .github/workflows/deploy-worker.yml
  workflow_dispatch:

permissions:
  contents: read

# Two deploys at once would race for the same script; queue them instead.
concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Never deploy code the tests already reject.
      - name: Run the Worker tests
        working-directory: worker
        run: npm test

      - name: Deploy to Cloudflare
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Add a repository secret named CLOUDFLARE_API_TOKEN with the Workers Scripts:Edit permission.}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Add a repository secret named CLOUDFLARE_ACCOUNT_ID with the account id that owns the Worker.}"
          npx --yes wrangler@4 deploy
