name: Deploy Worker

# Deploys the Cloudflare Worker that stores listing photos in R2 and sends
# FCM push notifications. Runs the test suite first; a failure blocks deploy.
on:
  push:
    branches: [main]
    paths:
      - worker/**
      - .github/workflows/deploy-worker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Worker (wrangler)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run the Worker tests
        working-directory: worker
        run: npm test

      - name: Deploy with Wrangler
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.168.0 deploy 2>&1 | tee deploy.log

      - name: Verify /health
        working-directory: worker
        run: |
          set -euo pipefail
          URL=$(grep -oE 'https://[^ ]+\.workers\.dev' deploy.log | head -n 1)
          echo "Worker URL: $URL"
          for i in $(seq 1 15); do
            RESP=$(curl -sS "$URL/health" || true)
            echo "attempt $i: $RESP"
            if echo "$RESP" | grep -q '"ok":true' \
               && echo "$RESP" | grep -q '"images":true'; then
              echo "Health check passed (ok, images all true)"
              exit 0
            fi
            sleep 3
          done
          echo "Health check failed"
          exit 1
