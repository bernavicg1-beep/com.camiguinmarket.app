name: Apply app links final

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Apply edits
        run: |
          printf '%s' "" | base64 -d > /tmp/apply.py
          python3 /tmp/apply.py "C7:3A:F1:15:85:CF:67:95:18:7B:77:6B:46:F8:F3:12:7F:AD:EC:E5:C7:A0:92:05:19:A5:13:97:E7:F6:2A:95"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add worker/index.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add Android App Links routes (assetlinks + deep-link fallback pages) and Telegram deep links"
          git push origin HEAD:main
