name: Verify push kinds (temporary)

on:
  push:
    branches: [freebuff/camiguin-market-map-kotlin-script]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Verify deployed /push kinds with the test account
        env:
          SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SMOKE_TEST_EMAIL" && test -n "$SMOKE_TEST_PASSWORD"

          API_KEY=$(python3 -c "import json;print(json.load(open('app/google-services.json'))['client'][0]['api_key'][0]['current_key'])")
          TOKEN=$(curl -s -X POST "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=$API_KEY" \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$SMOKE_TEST_EMAIL\",\"password\":\"$SMOKE_TEST_PASSWORD\",\"returnSecureToken\":true}" \
            | python3 -c "import sys,json;print(json.load(sys.stdin).get('idToken',''))")
          test -n "$TOKEN" || { echo "::error::sign-in failed"; exit 1; }
          echo "signed in ok"

          BASE="https://site-428436804b0946699db3b56b1b69fd96.freebuff.page"
          probe() {
            curl -s -o /tmp/out -w "%{http_code}" -X POST "$BASE/push" \
              -H 'Content-Type: application/json' \
              -H "Authorization: Bearer $TOKEN" -d "$1"
          }

          echo "== cart (bogus listing id) =="
          code=$(probe '{"kind":"cart","listingId":"does-not-exist"}')
          echo "$code $(cat /tmp/out)"
          [ "$code" = "404" ] || { echo "::error::cart branch not live"; exit 1; }

          echo "== rating (bogus order id) =="
          code=$(probe '{"kind":"rating","orderId":"does-not-exist"}')
          echo "$code $(cat /tmp/out)"
          [ "$code" = "404" ] || { echo "::error::rating branch not live"; exit 1; }

          echo "== moderation (non-admin) =="
          code=$(probe '{"kind":"moderation","sellerId":"someone","title":"x"}')
          echo "$code $(cat /tmp/out)"
          [ "$code" = "403" ] || [ "$code" = "200" ] || { echo "::error::moderation branch not live"; exit 1; }

          echo "all three push kinds are live"
