name: Debug build

on:
  push:
    branches: [debug-build]

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.9.1

      - name: Build and capture errors
        run: |
          gradle assembleDebug --no-daemon --console=plain > /tmp/g.log 2>&1
          status=$?
          {
            echo "exit=$status"
            echo "---- error lines ----"
            grep -nE "^e: |error:|FAILURE:|What went wrong|Caused by:|^> " /tmp/g.log | head -150
            echo "---- tail ----"
            tail -n 40 /tmp/g.log
          } > build-report.txt
          git config user.name "debug-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-report.txt
          git commit -m "chore: build report" || true
          git push origin HEAD:debug-build || true
          exit $status
