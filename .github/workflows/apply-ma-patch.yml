name: Apply MainActivity.kt app-link changes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Apply patch
        run: |
          cat > /tmp/ma.patch << 'PATCHEOF'
--- a/app/src/main/java/com/camiguinmarket/app/MainActivity.kt
+++ b/app/src/main/java/com/camiguinmarket/app/MainActivity.kt
@@ -172,6 +172,7 @@
         val target = when (type) {
             "order" -> intent.getStringExtra("orderId")?.let { "order:$it" }
             "chat" -> intent.getStringExtra("chatId")?.let { "chat:$it" }
+            "saved", "saved_search" -> intent.getStringExtra("savedSearchId")?.let { "saved:$it" }
             else -> null
         }
         if (BuildConfig.DEBUG) {
@@ -184,13 +185,39 @@
         return target
     }
 
-    /** Read a shared listing deep link (camiguinmarket://listing/{id}) from the intent. */
+    /** Read a deep link (camiguinmarket://listing|order|chat/{id}, or the
+     *  matching https://<worker>/... app link) from the intent. */
     private fun readDeepLinkTarget(intent: Intent?): String? {
         val uri = intent?.data ?: return null
-        if (uri.scheme != "camiguinmarket" || uri.host != "listing") return null
-        val id = uri.lastPathSegment?.let { android.net.Uri.decode(it) } ?: return null
-        if (id.isBlank()) return null
-        return "listing:$id"
+        // Custom scheme: camiguinmarket://<host>/<id>
+        if (uri.scheme == "camiguinmarket") {
+            val host = uri.host ?: return null
+            val id = uri.lastPathSegment?.let { android.net.Uri.decode(it) } ?: return null
+            if (id.isBlank()) return null
+            return when (host) {
+                "listing" -> "listing:$id"
+                "order" -> "order:$id"
+                "chat" -> "chat:$id"
+                else -> null
+            }
+        }
+        // Verified HTTPS app links on the worker origin.
+        if (uri.scheme == "https" && uri.host == "camiguin-market-images.bernavicg1.workers.dev") {
+            val segs = uri.pathSegments
+            if (segs.size >= 2) {
+                val kind = segs[0]
+                val id = android.net.Uri.decode(segs[1])
+                if (id.isNotBlank()) {
+                    return when (kind) {
+                        "listing" -> "listing:$id"
+                        "order" -> "order:$id"
+                        "chat" -> "chat:$id"
+                        else -> null
+                    }
+                }
+            }
+        }
+        return null
     }
 
     override fun onNewIntent(intent: Intent) {
@@ -667,6 +694,14 @@
                         }
                     }
                 }
+
+            "saved" -> {
+                // Open the saved searches screen; the id is informational.
+                overlay = "saved"
+                if (BuildConfig.DEBUG) {
+                    android.util.Log.d("CamiguinPush", "saved searches opened from $id")
+                }
+            }
         }
         onPushHandled()
     }
PATCHEOF
          git apply /tmp/ma.patch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/camiguinmarket/app/MainActivity.kt
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Add app-link deep-link parsing to MainActivity.kt (listing/order/chat/saved)"
          git push origin HEAD:main
