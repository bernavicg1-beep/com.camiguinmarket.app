name: Apply prompt-once patch

# One-shot: patches Extras.kt so the launch update prompt is shown at most once
# per installed version, commits it to main, then removes this workflow and its
# script. Manual dispatch only; it deletes itself on the way out.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-prompt-once
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Apply the patch
        run: python3 .github/patches/prompt-once.py

      - name: Commit and push
        run: |
          set -euo pipefail
          file=app/src/main/java/com/camiguinmarket/app/Extras.kt
          if git diff --quiet -- "$file"; then
            echo "No change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$file"
          git commit -m "feat(app): show the launch update prompt once per version"
          git push origin HEAD:main

      - name: Remove the one-shot scaffolding
        run: |
          set -euo pipefail
          git rm -q .github/patches/prompt-once.py
          git rm -q .github/workflows/apply-prompt-once.yml
          git commit -m "chore(ci): remove the one-shot prompt patch scaffolding"
          git push origin HEAD:main
