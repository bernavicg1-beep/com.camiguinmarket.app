name: Mint emulator token (temporary)

on:
  push:
    branches: [freebuff/camiguin-market-map-kotlin-script]

permissions:
  contents: read

jobs:
  mint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Mint custom token
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          UID: tPL9ygJ3ccdWpdUun1aPRnaHETC3
        run: node scripts/mint-token.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: custom-token
          path: custom-token.txt
          retention-days: 1
