name: Apply final cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/patches/apply_final_cleanup.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Apply
        run: python3 .github/patches/apply_final_cleanup.py

      - name: Commit and push
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/patches/apply_final_cleanup.py .github/workflows/apply-final-cleanup.yml
          git add app/src/main/java/com/camiguinmarket/app/Extras.kt \
            app/src/main/java/com/camiguinmarket/app/MainActivity.kt \
            app/src/main/java/com/camiguinmarket/app/Admin.kt \
            app/build.gradle.kts \
            app/src/main/AndroidManifest.xml \
            app/src/main/res/values/app_info.xml \
            .github/workflows/firestore-rules.yml \
            scripts/admin-pin-hash.py
          git commit -m "feat: in-app update prompt, server-side admin PIN, rules deploy guard, drop dead phone/Facebook code"
          git push origin main
