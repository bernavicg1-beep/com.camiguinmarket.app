name: Restore MainActivity.kt

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Restore file
        run: |
          printf '%s' 'PLACEHOLDER_REPLACE_WITH_BASE64' | base64 -d > app/src/main/java/com/camiguinmarket/app/MainActivity.kt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/camiguinmarket/app/MainActivity.kt
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Restore MainActivity.kt with app-link deep-link parsing"
          git push origin HEAD:main
