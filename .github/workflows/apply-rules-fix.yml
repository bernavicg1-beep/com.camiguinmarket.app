name: Apply checkout and trust fixes

# One-shot helper: the contents API truncates large sources, so the real
# changes are checked in as patches. This job applies them and removes itself.
on:
  push:
    branches: [fix/checkout-rules-and-trust]
    paths:
      - '.github/patches/**'

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-rules-fix]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/checkout-rules-and-trust
          fetch-depth: 0

      - name: Apply patches
        run: |
          set -euo pipefail
          for p in .github/patches/*.patch; do
            echo "applying $p"
            git apply -p1 --verbose "$p"
          done
          # Workflow files are updated through the API: the Actions token
          # cannot push changes under .github/workflows.
          git checkout -- .github/workflows/adb-smoke-test.yml

      - name: Commit and push the non-workflow changes
        run: |
          set -euo pipefail
          git config user.name "bernavicg1-beep"
          git config user.email "bernavicg1-beep@users.noreply.github.com"
          git rm -r --quiet .github/patches
          git add -A
          git diff --cached --stat
          git commit -m "Fix checkout reads, gate phoneVerified on a verified phone, and run emulator tests on x86_64"
          git push origin HEAD:refs/heads/fix/checkout-rules-and-trust
