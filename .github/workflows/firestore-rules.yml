name: Firestore rules

# Mo-validate sa rules sa matag kausaban, ug i-deploy kini sa Firebase
# kon na-set ang FIREBASE_TOKEN secret.
on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firebase.json
      - .firebaserc
      - .github/workflows/firestore-rules.yml
  pull_request:
    paths:
      - firestore.rules
      - firebase.json
      - .firebaserc
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate rules (Firestore emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Ang Firestore emulator sa firebase-tools nanginahanglan og JDK 21+.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      # Kon sayop ang syntax, mo-fail ang pag-start sa emulator ug mapalong ang job.
      - name: Compile ang firestore.rules
        run: >-
          firebase emulators:exec --only firestore --project demo-camiguin
          "echo RULES_OK"

  deploy:
    name: Deploy rules
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Ang secrets dili magamit direkta sa `if`, busa i-check dinhi isip env.
      # Wala gayud i-print ang value niini.
      - name: Check kon naa ba ang FIREBASE_TOKEN
        id: token
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$FIREBASE_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "✅ `FIREBASE_TOKEN` naka-set — i-deploy ang rules." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Wala ma-set ang FIREBASE_TOKEN — gilaktawan ang deploy sa rules."
            {
              echo "## ⚠️ Gilaktawan ang deploy sa Firestore rules"
              echo ""
              echo "Wala ma-set ang \`FIREBASE_TOKEN\`. I-generate kini pinaagi sa:"
              echo ""
              echo '```'
              echo "firebase login:ci"
              echo '```'
              echo ""
              echo "dayon idugang ang token sa **Settings → Secrets and variables → Actions**"
              echo "isip \`FIREBASE_TOKEN\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install firebase-tools
        if: steps.token.outputs.available == 'true'
        run: npm install -g firebase-tools

      - name: Deploy firestore.rules
        if: steps.token.outputs.available == 'true'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only firestore:rules --non-interactive
