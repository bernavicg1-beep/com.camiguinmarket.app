name: Firestore rules

# Mo-validate sa rules sa matag kausaban, ug i-deploy kini sa Firebase
# kon na-set ang FIREBASE_SERVICE_ACCOUNT (girekomendar) o FIREBASE_TOKEN.
on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firebase.json
      - .firebaserc
      - scripts/test-firestore-rules.py
      - .github/workflows/firestore-rules.yml
  pull_request:
    paths:
      - firestore.rules
      - firebase.json
      - .firebaserc
      - scripts/test-firestore-rules.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate rules (Firestore emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Ang Firestore emulator sa firebase-tools nanginahanglan og JDK 21+.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      # Kon sayop ang syntax, mo-fail ang pag-start sa emulator ug mapalong ang job.
      # Sulod sa emulator, gi-run ang behavioral test (anon / tag-iya / laing user).
      - name: Test ang firestore.rules sa emulator
        env:
          FIREBASE_PROJECT: demo-camiguin
        run: >-
          firebase emulators:exec --only firestore --project demo-camiguin
          "python3 scripts/test-firestore-rules.py"

  deploy:
    name: Deploy rules
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Ang secrets dili magamit direkta sa `if`, busa i-check dinhi.
      # Wala gayud i-print ang value niini.
      - name: Check kon unsang credential ang naa
        id: creds
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "method=service_account" >> "$GITHUB_OUTPUT"
            echo '✅ Ang FIREBASE_SERVICE_ACCOUNT naka-set — service account ang gamiton.' >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$FIREBASE_TOKEN" ]; then
            echo "method=token" >> "$GITHUB_OUTPUT"
            echo '✅ Ang FIREBASE_TOKEN naka-set — token ang gamiton (legasiya).' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "method=none" >> "$GITHUB_OUTPUT"
            echo "::notice::Wala ma-set ang FIREBASE_SERVICE_ACCOUNT o FIREBASE_TOKEN — gilaktawan ang deploy."
            {
              echo "## ⚠️ Gilaktawan ang deploy sa Firestore rules"
              echo ""
              echo "Idugang ang **Settings → Secrets and variables → Actions**:"
              echo ""
              echo "| Secret | Giunsa pagkuha |"
              echo "|---|---|"
              echo "| \`FIREBASE_SERVICE_ACCOUNT\` | Firebase Console → Project settings → Service accounts → Generate new private key (ang tibuok sulod sa JSON) |"
              echo "| \`FIREBASE_TOKEN\` | \`firebase login:ci\` (legasiya) |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install firebase-tools
        if: steps.creds.outputs.method != 'none'
        run: npm install -g firebase-tools

      # Ang key adto ra sa runner temp; wala gayud kini i-print o i-commit.
      - name: Isulat ang service account key
        if: steps.creds.outputs.method == 'service_account'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          key="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$key"
          chmod 600 "$key"
          # I-check nga tinuod nga service account key (walay value nga i-print).
          python3 - "$key" <<'PY'
          import json, sys

          path = sys.argv[1]
          try:
              data = json.load(open(path))
          except json.JSONDecodeError:
              print("::error::Dili balido nga JSON ang FIREBASE_SERVICE_ACCOUNT.")
              sys.exit(1)

          required = ("project_id", "private_key", "client_email", "token_uri")
          missing = [k for k in required if not data.get(k)]
          if data.get("type") != "service_account":
              missing.append("type=service_account")

          if missing:
              print("::error::Sayop ang sulod sa FIREBASE_SERVICE_ACCOUNT — kulang: " + ", ".join(missing))
              print("Kini nga secret kinahanglan ang PRIVATE KEY JSON (dunay private_key, client_email,"
                    " project_id) gikan sa Firebase Console → Project settings → Service accounts →"
                    " Generate new private key. Dili kini ang google-services.json.")
              sys.exit(1)

          print(f"Service account: {data['client_email']} | project: {data['project_id']}")
          PY
          echo "GOOGLE_APPLICATION_CREDENTIALS=$key" >> "$GITHUB_ENV"

      - name: Deploy firestore.rules (service account)
        if: steps.creds.outputs.method == 'service_account'
        env:
          NO_COLOR: "1"
        run: |
          set +e
          firebase deploy --only firestore:rules --non-interactive \
            > "$RUNNER_TEMP/deploy.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/deploy.log"
          {
            echo ""
            if [ "$status" -eq 0 ]; then
              echo "✅ Na-deploy ang firestore.rules sa Firebase."
            else
              echo "## ❌ Ni-fail ang deploy sa Firestore rules (exit $status)"
              echo ""
              echo '```'
              grep -iE "error|denied|permission|403|404|invalid|forbidden|missing|firebaserules|not found|ENOENT|failed" \
                "$RUNNER_TEMP/deploy.log" | head -15
              echo '--- katapusan sa log ---'
              tail -n 20 "$RUNNER_TEMP/deploy.log"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Deploy firestore.rules (FIREBASE_TOKEN)
        if: steps.creds.outputs.method == 'token'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only firestore:rules --non-interactive
