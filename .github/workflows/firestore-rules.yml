name: Firestore rules

# Validate the rules on every change, and deploy them to Firebase
# when FIREBASE_SERVICE_ACCOUNT (recommended) or FIREBASE_TOKEN is set.
on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firebase.json
      - .firebaserc
      - scripts/test-firestore-rules.py
      - .github/workflows/firestore-rules.yml
  pull_request:
    paths:
      - firestore.rules
      - firebase.json
      - .firebaserc
      - scripts/test-firestore-rules.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate rules (Firestore emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Ang Firestore emulator sa firebase-tools nanginahanglan og JDK 21+.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      # A syntax error makes the emulator fail to start and kills the job.
      # Inside the emulator the behavioral tests run (anon / owner / other user).
      - name: Test firestore.rules in the emulator
        env:
          FIREBASE_PROJECT: demo-camiguin
        run: >-
          firebase emulators:exec --only firestore --project demo-camiguin
          "python3 scripts/test-firestore-rules.py"

  deploy:
    name: Deploy rules
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Secrets cannot be used directly in `if`, so check them here.
      # Their values are never printed.
      - name: Check which credential is available
        id: creds
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "method=service_account" >> "$GITHUB_OUTPUT"
            echo '✅ FIREBASE_SERVICE_ACCOUNT is set — the service account will be used.' >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$FIREBASE_TOKEN" ]; then
            echo "method=token" >> "$GITHUB_OUTPUT"
            echo '✅ FIREBASE_TOKEN is set — the token will be used (legacy).' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "method=none" >> "$GITHUB_OUTPUT"
            echo "::notice::FIREBASE_SERVICE_ACCOUNT and FIREBASE_TOKEN are not set — the deploy was skipped."
            {
              echo "## ⚠️ Firestore rules deploy skipped"
              echo ""
              echo "Add these in **Settings → Secrets and variables → Actions**:"
              echo ""
              echo "| Secret | How to get it |"
              echo "|---|---|"
              echo "| \`FIREBASE_SERVICE_ACCOUNT\` | Firebase Console → Project settings → Service accounts → Generate new private key (the whole JSON) |"
              echo "| \`FIREBASE_TOKEN\` | \`firebase login:ci\` (legacy) |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install firebase-tools
        if: steps.creds.outputs.method != 'none'
        run: npm install -g firebase-tools

      # The key only goes to the runner temp; it is never printed or committed.
      - name: Write the service account key
        if: steps.creds.outputs.method == 'service_account'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          key="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$key"
          chmod 600 "$key"
          # Check that this is a real service account key (no values printed).
          python3 - "$key" <<'PY'
          import json, sys

          path = sys.argv[1]
          try:
              data = json.load(open(path))
          except json.JSONDecodeError:
              print("::error::FIREBASE_SERVICE_ACCOUNT is not valid JSON.")
              sys.exit(1)

          required = ("project_id", "private_key", "client_email", "token_uri")
          missing = [k for k in required if not data.get(k)]
          if data.get("type") != "service_account":
              missing.append("type=service_account")

          if missing:
              print("::error::FIREBASE_SERVICE_ACCOUNT is wrong — missing: " + ", ".join(missing))
              print("This secret must be the PRIVATE KEY JSON (with private_key, client_email,"
                    " project_id) from Firebase Console → Project settings → Service accounts →"
                    " Generate new private key. It is not google-services.json.")
              sys.exit(1)

          print(f"Service account: {data['client_email']} | project: {data['project_id']}")
          PY
          echo "GOOGLE_APPLICATION_CREDENTIALS=$key" >> "$GITHUB_ENV"

      - name: Deploy firestore.rules (service account)
        if: steps.creds.outputs.method == 'service_account'
        env:
          NO_COLOR: "1"
        run: |
          set +e
          firebase deploy --only firestore:rules --non-interactive \
            > "$RUNNER_TEMP/deploy.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/deploy.log"
          {
            echo ""
            if [ "$status" -eq 0 ]; then
              echo "✅ Na-deploy ang firestore.rules sa Firebase."
            else
              echo "## ❌ Ni-fail ang deploy sa Firestore rules (exit $status)"
              echo ""
              echo '```'
              grep -iE "error|denied|permission|403|404|invalid|forbidden|missing|firebaserules|not found|ENOENT|failed" \
                "$RUNNER_TEMP/deploy.log" | head -15
              echo '--- katapusan sa log ---'
              tail -n 20 "$RUNNER_TEMP/deploy.log"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Verify deployed rules match local file
        if: steps.creds.outputs.method == 'service_account'
        env:
          NO_COLOR: "1"
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/firebase-service-account.json"
          project=$(python3 -c "import json;print(json.load(open('$key'))['project_id'])")
          email=$(python3 -c "import json;print(json.load(open('$key'))['client_email'])")
          python3 -c "import json;print(json.load(open('$key'))['private_key'],end='')" > "$RUNNER_TEMP/sa.pem"

          header=$(printf '{"alg":"RS256","typ":"JWT"}' | base64 -w0 | tr '+/' '-_' | tr -d '=')
          now=$(date +%s)
          exp=$((now + 3600))
          payload=$(printf '{"iss":"%s","scope":"https://www.googleapis.com/auth/firebase https://www.googleapis.com/auth/cloud-platform","aud":"https://oauth2.googleapis.com/token","iat":%d,"exp":%d}' "$email" "$now" "$exp" | base64 -w0 | tr '+/' '-_' | tr -d '=')
          sig_input="$header.$payload"
          sig=$(printf '%s' "$sig_input" | openssl dgst -sha256 -sign "$RUNNER_TEMP/sa.pem" | base64 -w0 | tr '+/' '-_' | tr -d '=')
          jwt="$sig_input.$sig"

          access_token=$(curl -s -X POST https://oauth2.googleapis.com/token             -d "grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer&assertion=$jwt"             | python3 -c "import sys,json;print(json.load(sys.stdin)['access_token'])")

          release=$(curl -s -H "Authorization: Bearer $access_token"             "https://firebaserules.googleapis.com/v1/projects/$project/releases/cloud.firestore")
          ruleset_name=$(printf '%s' "$release" | python3 -c "import sys,json;print(json.load(sys.stdin)['rulesetName'])")
          ruleset=$(curl -s -H "Authorization: Bearer $access_token"             "https://firebaserules.googleapis.com/v1/$ruleset_name")
          printf '%s' "$ruleset" | python3 -c             "import sys,json; d=json.load(sys.stdin); print(d['source']['files'][0]['content'],end='')"             > "$RUNNER_TEMP/deployed.rules"

          # Normalize trailing whitespace for comparison.
          sed 's/[[:space:]]*$//' firestore.rules > "$RUNNER_TEMP/local.norm"
          sed 's/[[:space:]]*$//' "$RUNNER_TEMP/deployed.rules" > "$RUNNER_TEMP/deployed.norm"

          if diff -u "$RUNNER_TEMP/local.norm" "$RUNNER_TEMP/deployed.norm" > "$RUNNER_TEMP/rules.diff"; then
            echo "✅ Deployed Firestore rules match local firestore.rules"
            echo "✅ Deployed Firestore rules match local firestore.rules" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ❌ Deployed rules do NOT match local firestore.rules" >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/rules.diff" >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/rules.diff"
            exit 1
          fi

      - name: Deploy firestore.rules (FIREBASE_TOKEN)
        if: steps.creds.outputs.method == 'token'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only firestore:rules --non-interactive
