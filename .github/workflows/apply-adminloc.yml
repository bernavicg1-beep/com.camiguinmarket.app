name: Apply admin-dashboard localization

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Apply the patch and commit
        run: |
          set -euo pipefail
          git apply --whitespace=nowarn .github/patches/adminloc.patch
          rm -f .github/patches/adminloc.patch .github/workflows/apply-adminloc.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: localize Admin dashboard label (Cebuano)"
          git push origin HEAD:main
