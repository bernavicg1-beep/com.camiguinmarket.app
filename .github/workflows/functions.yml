name: Deploy Cloud Functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/functions.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        working-directory: functions
        run: npm ci

      # Ang secret mahimong (a) JSON mismo o (b) base64 sa JSON. Ihanda ang
      # key file ug i-print ang dili-sekreto nga detalye aron sayon i-diagnose.
      - name: Prepare service account
        id: creds
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -z "${SA:-}" ]; then
            echo "Missing FIREBASE_SERVICE_ACCOUNT secret."
            exit 1
          fi
          dir="$RUNNER_TEMP/sa"
          mkdir -p "$dir"
          if printf '%s' "$SA" | python3 -c 'import json,sys; json.load(sys.stdin)' 2>/dev/null; then
            printf '%s' "$SA" > "$dir/key.json"
            echo "Format: JSON"
          else
            printf '%s' "$SA" | base64 -d > "$dir/key.json"
            echo "Format: base64"
            python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "$dir/key.json"
          fi
          python3 - "$dir/key.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          print("service account:", d.get("client_email"))
          print("project:", d.get("project_id"))
          assert d.get("private_key"), "wala ang private_key sa service account JSON"
          PY
          echo "path=$dir/key.json" >> "$GITHUB_OUTPUT"

      - name: Deploy functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.creds.outputs.path }}
        run: npx --yes firebase-tools@latest deploy --only functions --non-interactive --force
