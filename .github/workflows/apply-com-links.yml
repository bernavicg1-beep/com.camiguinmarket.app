name: Apply COM contact-links fix

on:
  push:
    paths:
      - '.github/patches/00-trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/com-spec

      - name: Apply patches
        run: |
          set -euo pipefail
          for p in .github/patches/*.patch; do
            echo "Applying $p"
            git apply --verbose "$p"
          done

      - name: Commit and clean up
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf .github/patches
          git rm -f .github/workflows/apply-com-links.yml
          git add app/src/main/java/com/camiguinmarket/app/Extras.kt app/src/main/java/com/camiguinmarket/app/Orders.kt firestore.rules scripts/test-firestore-rules.py
          git commit -m "Allow contact links (Telegram/Messenger/WhatsApp) in user profiles"
          git push origin HEAD:feature/com-spec
